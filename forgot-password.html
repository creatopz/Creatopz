<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Creatopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz mark"> Creatopz<sup>™</sup></a>
    <div class="nav-cta">
      <a href="login.html" class="btn btn-outline-dark" style="padding:10px 20px;font-size:14px;">Log in</a>
    </div>
  </nav>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Forgot password</h1>
    <p class="sub">We'll email you a link to reset it.</p>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <p class="form-error" id="formError"></p>
      <p class="form-success" id="formSuccess"></p>
      <div class="submit-row">
        <button type="submit" class="btn btn-red" id="submitBtn" style="width:100%;">Send reset link</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const errorEl = document.getElementById("formError");
    const successEl = document.getElementById("formSuccess");
    errorEl.style.display = "none";
    successEl.style.display = "none";
    setButtonLoading(btn, true, "Sending...");
    try {
      const email = document.getElementById("email").value.trim();
      await sendPasswordReset(email);
      successEl.textContent = "Check your inbox for a reset link.";
      successEl.style.display = "block";
    } catch (err) {
      errorEl.textContent = friendlyAuthError(err);
      errorEl.style.display = "block";
    } finally {
      setButtonLoading(btn, false);
    }
  });
</script>
</body>
</html>
