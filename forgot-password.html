<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Creatopz™</title>
<meta name="description" content="Reset your Creatopz account password.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz logo">Creatopz<sup>™</sup></a>
    <a href="auth.html" class="btn btn-outline btn-sm">Log in</a>
  </nav>
</header>

<section class="wrap" style="max-width:440px;min-height:70vh;display:flex;align-items:center;">
  <div class="panel" style="padding:36px;width:100%;">
    <h1 style="font-size:28px;">Forgot password</h1>
    <p class="body-sm" style="margin:8px 0 26px;">We'll email you a link to reset it.</p>

    <form id="forgotForm">
      <div class="field"><label for="email">Email</label><input class="input" type="email" id="email" required></div>
      <div class="error-text" id="formError" style="min-height:20px;"></div>
      <div class="badge badge-success" id="formSuccess" style="display:none;padding:12px 16px;margin-bottom:14px;white-space:normal;">Check your inbox for a reset link.</div>
      <button type="submit" class="btn btn-accent btn-block btn-lg" id="submitBtn">Send reset link</button>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("formError");
  const successEl = document.getElementById("formSuccess");
  errorEl.textContent = "";
  successEl.style.display = "none";
  setButtonLoading(btn, true, "Sending...");
  try {
    const email = document.getElementById("email").value.trim();
    await sendPasswordReset(email);
    successEl.style.display = "block";
  } catch (err) {
    errorEl.textContent = friendlyAuthError(err);
  } finally {
    setButtonLoading(btn, false);
  }
});
</script>
<script src="js/motion.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
