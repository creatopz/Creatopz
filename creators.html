<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Directory — Creatopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EC;
    --card:#FBF9F4;
    --line:#E4DFD3;
    --chip:#EDE8DC;
    --ink:#1E1A14;
    --muted:#8A8172;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);}
  .serif{font-family:'Playfair Display',serif;}
  a{color:inherit;text-decoration:none;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--line);background:var(--card);}
  .topbar .brand{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .topbar .brand img{height:26px;width:auto;}
  .topbar a.back{font-size:13px;color:var(--muted);}

  .wrap{max-width:1040px;margin:0 auto;padding:40px 24px 80px;}
  header{margin-bottom:36px;}
  header h1{font-size:40px;font-weight:600;margin:0 0 8px;line-height:1.1;}
  header p{margin:0;color:var(--muted);font-size:16px;}

  .filters{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0;}
  .filters input, .filters select{
    padding:11px 14px;border:1px solid var(--line);background:var(--card);
    font-family:inherit;font-size:14px;color:var(--ink);border-radius:2px;
  }
  .filters input{flex:1;min-width:200px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:24px;}
  .card{
    background:var(--card);border:1px solid var(--line);text-align:left;cursor:pointer;
    padding:0;font-family:inherit;transition:transform .3s ease, box-shadow .3s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -20px rgba(30,26,20,0.35);}
  .card-bar{height:3px;width:100%;}
  .card-body{padding:24px;}
  .card-top{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .card-avatar{width:64px;height:64px;flex-shrink:0;overflow:hidden;border:1px solid var(--line);border-radius:50%;background:#eee;}
  .card-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .eyebrow{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:500;margin:0 0 4px;}
  .card-name{font-size:24px;margin:0;line-height:1.15;}
  .stat-row{display:flex;gap:32px;padding-top:16px;border-top:1px solid var(--line);}
  .stat-num{font-size:24px;margin:0;}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin:2px 0 0;}

  .empty-state{display:none;text-align:center;padding:60px 20px;color:var(--muted);}
  .load-more{display:none;margin:32px auto 0;padding:12px 28px;border:1px solid var(--ink);background:transparent;font-family:inherit;font-size:14px;cursor:pointer;}
  .load-more:hover{background:var(--ink);color:#fff;}

  .overlay{position:fixed;inset:0;background:rgba(30,26,20,0.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .overlay.open{display:flex;}
  .modal{position:relative;width:100%;max-width:720px;max-height:88vh;overflow-y:auto;background:var(--card);box-shadow:0 30px 80px -20px rgba(0,0,0,0.4);
    opacity:0;transform:translateY(18px) scale(0.98);transition:opacity .35s cubic-bezier(0.16,1,0.3,1), transform .35s cubic-bezier(0.16,1,0.3,1);}
  .overlay.open .modal{opacity:1;transform:translateY(0) scale(1);}

  .card{ transition:transform .4s cubic-bezier(0.16,1,0.3,1), box-shadow .4s cubic-bezier(0.16,1,0.3,1); }
  .card:hover{transform:translateY(-6px);box-shadow:0 22px 44px -22px rgba(30,26,20,0.35);}
  .stagger-item{opacity:0;transform:translateY(20px);transition:opacity .5s cubic-bezier(0.16,1,0.3,1), transform .5s cubic-bezier(0.16,1,0.3,1);}
  .stagger-item.is-visible{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){ .modal, .stagger-item{ transition:none !important; } }
  .modal-bar{height:4px;width:100%;}
  .modal-close{position:absolute;top:20px;right:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);cursor:pointer;}
  .modal-close:hover{background:var(--chip);}
  .modal-inner{padding:40px;}
  @media (max-width:600px){ .modal-inner{padding:28px 20px;} }
  .modal-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:32px;}
  .modal-avatar{width:80px;height:80px;flex-shrink:0;overflow:hidden;border:1px solid var(--line);border-radius:50%;background:#eee;}
  .modal-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .modal-name{font-size:32px;margin:8px 0 0;line-height:1.1;}
  .modal-stats{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-bottom:32px;margin-bottom:32px;border-bottom:1px solid var(--line);}
  .modal-stat{display:flex;align-items:center;gap:12px;}
  .modal-stat .stat-num{font-size:28px;}
  .section-title{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:500;color:var(--muted);margin:0 0 16px;}
  .brands{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;}
  .brand-chip{padding:8px 16px;font-size:14px;background:var(--chip);border:1px solid var(--line);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  @media (max-width:600px){ .two-col{grid-template-columns:1fr;} }
  .loc-list{list-style:none;margin:0;padding:0;}
  .loc-list li{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0;}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz mark">Creatopz™</a>
  <a href="index.html" class="back">← Back to site</a>
</div>

<div class="wrap">
  <header>
    <h1 class="serif">Creator Directory</h1>
    <p>Vetted micro-influencers, ready for your next campaign.</p>
  </header>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Search by name, username, or category...">
    <select id="categoryFilter">
      <option value="">All categories</option>
      <option>Fashion & Style</option>
      <option>Beauty</option>
      <option>Food</option>
      <option>Travel</option>
      <option>Fitness</option>
      <option>Tech</option>
      <option>Comedy</option>
      <option>Lifestyle</option>
      <option>Finance</option>
      <option>Gaming</option>
      <option>Other</option>
    </select>
    <select id="sortFilter">
      <option value="newest">Newest</option>
      <option value="followers">Most followers</option>
      <option value="engagement">Highest engagement</option>
    </select>
  </div>

  <div class="grid" id="cardGrid"></div>
  <div class="empty-state" id="emptyState">
    <p style="font-size:20px;font-family:'Playfair Display',serif;">No creators found.</p>
    <p style="font-size:14px;">Try changing your filters.</p>
  </div>
  <button class="load-more" id="loadMoreBtn">Load more</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/motion.js"></script>
<script src="js/creators.js"></script>
<script>
  initCreatorDirectory();
</script>
</body>
</html>
