<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Creatopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/soften.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz mark"> Creatopz<sup>™</sup></a>
  </nav>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="sub">This link is single-use and expires after a while — request a new one if it's stopped working.</p>

    <form id="resetForm">
      <div class="field">
        <label for="password">New password</label>
        <div class="password-field">
          <input type="password" id="password" minlength="6" required>
          <button type="button" class="password-toggle" data-target="password"></button>
        </div>
      </div>
      <p class="form-error" id="formError"></p>
      <p class="form-success" id="formSuccess"></p>
      <div class="submit-row">
        <button type="submit" class="btn btn-red" id="submitBtn" style="width:100%;">Update password</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const errorEl = document.getElementById("formError");
    const successEl = document.getElementById("formSuccess");
    errorEl.style.display = "none";
    successEl.style.display = "none";
    setButtonLoading(btn, true, "Updating...");
    try {
      const password = document.getElementById("password").value;
      await updatePassword(password);
      successEl.textContent = "Password updated. Redirecting to log in...";
      successEl.style.display = "block";
      setTimeout(() => (window.location.href = "login.html"), 1500);
    } catch (err) {
      errorEl.textContent = friendlyAuthError(err);
      errorEl.style.display = "block";
    } finally {
      setButtonLoading(btn, false);
    }
  });
</script>
</body>
</html>
