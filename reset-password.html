<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Creatopz™</title>
<meta name="description" content="Set a new password for your Creatopz account.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e7473c">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz logo">Creatopz<sup>™</sup></a>
  </nav>
</header>

<section class="wrap" style="max-width:440px;min-height:70vh;display:flex;align-items:center;">
  <div class="panel" style="padding:36px;width:100%;">
    <h1 style="font-size:28px;">Set a new password</h1>
    <p class="body-sm" style="margin:8px 0 26px;">This link is single-use and expires after a while — request a new one if it's stopped working.</p>

    <form id="resetForm">
      <div class="field">
        <label for="password">New password</label>
        <div class="password-field">
          <input class="input" type="password" id="password" minlength="6" required>
          <button type="button" class="password-toggle" data-target="password"></button>
        </div>
      </div>
      <div class="error-text" id="formError" style="min-height:20px;"></div>
      <div class="badge badge-success" id="formSuccess" style="display:none;padding:12px 16px;margin-bottom:14px;white-space:normal;">Password updated. Redirecting to log in...</div>
      <button type="submit" class="btn btn-accent btn-block btn-lg" id="submitBtn">Update password</button>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("formError");
  const successEl = document.getElementById("formSuccess");
  errorEl.textContent = "";
  successEl.style.display = "none";
  setButtonLoading(btn, true, "Updating...");
  try {
    const password = document.getElementById("password").value;
    await updatePassword(password);
    successEl.style.display = "block";
    setTimeout(() => (window.location.href = "auth.html"), 1500);
  } catch (err) {
    errorEl.textContent = friendlyAuthError(err);
  } finally {
    setButtonLoading(btn, false);
  }
});
</script>
<script src="js/motion.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
