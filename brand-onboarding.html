<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company profile — Creatopz™</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/theme.css">
<style>
  .avatar-upload{ display:flex; align-items:center; gap:18px; margin-bottom:30px; }
  .avatar-preview{ width:88px; height:88px; border-radius:var(--r-lg); overflow:hidden; background:var(--surface-2); flex-shrink:0; }
  .avatar-preview img{ width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz logo">Creatopz<sup>™</sup></a>
    <div class="nav-actions" id="authNav"></div>
  </nav>
</header>

<section class="wrap" style="max-width:680px;padding:44px 32px 80px;">
  <h1>Company profile</h1>
  <p class="body-sm" style="margin-top:6px;margin-bottom:28px;">Tell creators who you are before you post a campaign.</p>

  <div class="panel" style="padding:32px;">
    <div class="avatar-upload">
      <div class="avatar-preview" id="logoPreview"><img id="logoImg" src="" alt="Logo preview" style="display:none;"></div>
      <div>
        <label class="btn btn-outline btn-sm" style="cursor:pointer;">
          Upload logo
          <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/gif" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;">
        </label>
        <p class="hint" style="margin-top:8px;">Company logo, up to 5MB.</p>
      </div>
    </div>

    <form id="brandForm">
      <div class="grid grid-2">
        <div class="field"><label for="companyName">Company name</label><input class="input" type="text" id="companyName" required></div>
        <div class="field"><label for="username">Username</label><input class="input" type="text" id="username" placeholder="e.g. acme-co" required></div>
      </div>
      <div class="field"><label for="description">Description</label><textarea class="input" id="description" placeholder="What does your brand do?"></textarea></div>
      <div class="grid grid-2">
        <div class="field"><label for="website">Website</label><input class="input" type="url" id="website" placeholder="https://..."></div>
        <div class="field"><label for="industry">Industry</label><input class="input" type="text" id="industry" placeholder="e.g. Fashion, D2C, SaaS"></div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label for="contactEmail">Contact email</label><input class="input" type="email" id="contactEmail" required></div>
        <div class="field"><label for="contactPhone">Contact phone</label><input class="input" type="text" id="contactPhone"></div>
      </div>
      <div class="field"><label for="location">Location</label><input class="input" type="text" id="location" placeholder="e.g. Mumbai, India"></div>

      <div class="error-text" id="formError" style="min-height:20px;margin-bottom:10px;"></div>
      <button type="submit" class="btn btn-accent btn-block btn-lg" id="submitBtn">Save company profile</button>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script>
let brand = null;

document.getElementById("logoFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = document.getElementById("logoImg");
  img.src = URL.createObjectURL(file);
  img.style.display = "block";
});

async function init() {
  const authedProfile = await requireAuth("brand");
  if (!authedProfile) return;
  renderAuthNav("#authNav");
  brand = await getMyBrandProfile(authedProfile.id);
  if (brand) {
    document.getElementById("companyName").value = brand.company_name || "";
    document.getElementById("username").value = brand.username || "";
    document.getElementById("description").value = brand.description || "";
    document.getElementById("website").value = brand.website || "";
    document.getElementById("industry").value = brand.industry || "";
    document.getElementById("contactEmail").value = brand.contact_email || authedProfile.email || "";
    document.getElementById("contactPhone").value = brand.contact_phone || "";
    document.getElementById("location").value = brand.location || "";
    if (brand.logo_url) { document.getElementById("logoImg").src = brand.logo_url; document.getElementById("logoImg").style.display = "block"; }
  } else {
    document.getElementById("companyName").value = authedProfile.full_name || "";
    document.getElementById("contactEmail").value = authedProfile.email || "";
  }
}
init();

document.getElementById("brandForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("formError");
  errorEl.textContent = "";
  setButtonLoading(btn, true, "Saving...");
  try {
    const authedProfile = await getCurrentProfile();
    const file = document.getElementById("logoFile").files[0];
    let logoUrl = brand?.logo_url || null;
    if (file) logoUrl = await uploadImage(file, "brand-logos", authedProfile.id);
    const fields = {
      company_name: document.getElementById("companyName").value.trim(),
      username: document.getElementById("username").value.trim(),
      description: document.getElementById("description").value.trim(),
      website: document.getElementById("website").value.trim(),
      industry: document.getElementById("industry").value.trim(),
      contact_email: document.getElementById("contactEmail").value.trim(),
      contact_phone: document.getElementById("contactPhone").value.trim(),
      location: document.getElementById("location").value.trim(),
      logo_url: logoUrl,
    };
    await saveBrandProfile(authedProfile.id, fields);
    showToast("Company profile saved!", "success");
    setTimeout(() => (window.location.href = "dashboard-brand.html"), 900);
  } catch (err) {
    errorEl.textContent = friendlyAuthError(err);
  } finally {
    setButtonLoading(btn, false);
  }
});
</script>
</body>
</html>
