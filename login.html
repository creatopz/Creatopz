<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Creatopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz mark"> Creatopz<sup>™</sup></a>
    <div class="nav-cta">
      <a href="signup.html" class="btn btn-red" style="padding:10px 20px;font-size:14px;">Sign up</a>
    </div>
  </nav>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your Creatopz account.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" required>
          <button type="button" class="password-toggle" data-target="password"></button>
        </div>
      </div>
      <p class="form-error" id="formError"></p>
      <div class="submit-row">
        <button type="submit" class="btn btn-red" id="submitBtn" style="width:100%;">Log in</button>
      </div>
    </form>
    <p style="margin-top:18px;font-size:14px;">
      <a href="forgot-password.html" style="color:var(--grey);">Forgot your password?</a>
    </p>
    <p style="margin-top:10px;font-size:14px;color:var(--grey);">
      New to Creatopz? <a href="signup.html" style="color:var(--red);font-weight:600;">Create an account</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const errorEl = document.getElementById("formError");
    errorEl.style.display = "none";
    setButtonLoading(btn, true, "Logging in...");
    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      await logIn(email, password);
      const profile = await getCurrentProfile();
      window.location.href =
        profile?.role === "admin"
          ? "admin.html"
          : profile?.role === "brand"
          ? "brand-dashboard.html"
          : "creator-dashboard.html";
    } catch (err) {
      errorEl.textContent = friendlyAuthError(err);
      errorEl.style.display = "block";
      setButtonLoading(btn, false);
    }
  });

  // If already logged in, skip straight to dashboard.
  (async () => {
    const profile = await getCurrentProfile().catch(() => null);
    if (profile) {
      window.location.href =
        profile.role === "admin"
          ? "admin.html"
          : profile.role === "brand"
          ? "brand-dashboard.html"
          : "creator-dashboard.html";
    }
  })();
</script>
</body>
</html>
