<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/soften.css">
<title>Messages — Creatopz</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  *{box-sizing:border-box;}
  a{color:inherit;text-decoration:none;}
  a:hover{color:#FF3300;}
  ::selection{background:#FF3300;color:#fff;}
  button,input,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid #FF3300;outline-offset:2px;}
  @media (max-width:860px){
    .dc-nav{flex-wrap:wrap;row-gap:10px;}
    .dc-nav-links{flex-wrap:wrap;gap:14px !important;font-size:13.5px !important;order:3;width:100%;justify-content:flex-start;}
  }
  @view-transition{navigation:auto;}
  html{scroll-behavior:smooth;}
  a,button,input,select,textarea{transition:background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s cubic-bezier(.16,1,.3,1), opacity .2s ease;}
</style>
</helmet>

<div ref="{{ rootRef }}" style="font-family:Inter,system-ui,sans-serif;color:#000;background:#fff;min-height:100vh;display:flex;flex-direction:column;">

  <header style="border-bottom:2px solid #000;">
    <nav class="dc-nav" style="max-width:1180px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
      <a href="index.html" style="display:flex;align-items:center;gap:10px;font-family:Anton,sans-serif;font-size:21px;">
        <img src="assets/logo.png" alt="Creatopz mark" style="height:32px;display:block;">Creatopz<sup style="font-family:Inter,sans-serif;font-size:10px;">™</sup>
      </a>
      <a href="{{ dashboardHref }}" style="font-size:14px;font-weight:600;border-bottom:2px solid #FF3300;">← Back to dashboard</a>
    </nav>
  </header>

  <section style="flex:1;display:flex;flex-direction:column;max-width:820px;width:100%;margin:0 auto;padding:32px;">
    <h1 style="font-family:Anton,sans-serif;font-weight:400;font-size:30px;margin:0 0 6px;">Messages</h1>
    <p style="color:#5C5C5C;font-size:14.5px;margin:0 0 28px;">Direct line to the Creatopz team — separate from campaign applications.</p>

    <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
      <div style="border:2px solid #000;padding:48px 24px;color:#5C5C5C;">Loading…</div>
    </sc-if>

    <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
      <div style="border:2px solid #000;flex:1;display:flex;flex-direction:column;min-height:420px;">
        <div style="flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:52vh;">
          <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
            <div style="color:#8a8a8a;font-size:14px;">No messages yet — say hello and the Creatopz team will reply here.</div>
          </sc-if>
          <sc-for list="{{ messages }}" as="m" hint-placeholder-count="4">
            <div style="align-self:{{ m.align }};max-width:78%;">
              <div style="font-size:11px;color:#8a8a8a;margin-bottom:4px;text-align:{{ m.textAlign }};">{{ m.who }} · {{ m.when }}</div>
              <div style="background:{{ m.bg }};color:{{ m.fg }};border:2px solid #000;padding:12px 16px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere;">{{ m.body }}</div>
            </div>
          </sc-for>
        </div>
        <form onSubmit="{{ send }}" style="border-top:2px solid #000;display:flex;gap:10px;padding:16px;">
          <input value="{{ draft }}" onInput="{{ onDraft }}" placeholder="Write a message…" style="flex:1;border:2px solid #DCD8D1;padding:12px 14px;font-size:14.5px;outline:none;">
          <button type="submit" style="background:#FF3300;color:#fff;border:none;font-weight:700;padding:12px 22px;cursor:pointer;">{{ sendLabel }}</button>
        </form>
      </div>
    </sc-if>

    <div style="font-size:13.5px;color:#FF3300;min-height:20px;margin-top:14px;">{{ error }}</div>
  </section>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { loading: true, session: null, role: null, conversationId: null, messages: [], draft: "", sending: false, error: "" };
  rootRef = React.createRef();

  scrollAlign(m) {
    const mine = m.sender_id === this.state.session.user.id;
    return {
      align: mine ? "flex-end" : "flex-start",
      textAlign: mine ? "right" : "left",
      bg: mine ? "#000" : "#EFEDE8",
      fg: mine ? "#fff" : "#000",
      who: mine ? "You" : "Creatopz team",
      when: new Date(m.sent_at).toLocaleString(),
      body: m.body
    };
  }

  async loadMessages(conversationId) {
    const { data } = await supabaseClient.from("messages").select("*").eq("conversation_id", conversationId).order("sent_at", { ascending: true });
    this.setState({ messages: (data || []).map((m) => this.scrollAlign(m)) });
  }

  send = async (e) => {
    e.preventDefault();
    const { draft, conversationId, session, sending } = this.state;
    if (!draft.trim() || sending) return;
    this.setState({ sending: true });
    const { error } = await supabaseClient.from("messages").insert({ conversation_id: conversationId, sender_id: session.user.id, body: draft.trim() });
    this.setState({ sending: false });
    if (error) return this.setState({ error: error.message });
    this.setState({ draft: "" });
    await this.loadMessages(conversationId);
  };

  renderVals() {
    const { loading, messages, draft, sending, error } = this.state;
    return {
      rootRef: this.rootRef,
      dashboardHref: this.state.role === "brand" ? "dashboard-brand.html" : "dashboard-creator.html",
      loading,
      ready: !loading,
      empty: !loading && messages.length === 0,
      messages,
      draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      sendLabel: sending ? "Sending…" : "Send",
      send: this.send,
      error
    };
  }

  async componentDidMount() {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const session = sessionData?.session;
    if (!session) { location.href = "auth.html"; return; }
    const { data: profile } = await supabaseClient.from("profiles").select("role").eq("id", session.user.id).single();
    if (profile?.role === "admin") { location.href = "admin-console.html"; return; }
    this.setState({ session, role: profile?.role });

    let { data: convo } = await supabaseClient.from("conversations").select("*").eq("participant_id", session.user.id).maybeSingle();
    if (!convo) {
      const { data: created, error } = await supabaseClient.from("conversations").insert({ participant_id: session.user.id }).select().single();
      if (error) { this.setState({ loading: false, error: "Couldn't start a conversation: " + error.message }); return; }
      convo = created;
    }
    this.setState({ conversationId: convo.id, loading: false });
    await this.loadMessages(convo.id);

    this.channel = supabaseClient
      .channel("messages-" + convo.id)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "conversation_id=eq." + convo.id }, () => {
        this.loadMessages(convo.id);
      })
      .subscribe();
  }

  componentWillUnmount() {
    if (this.channel) supabaseClient.removeChannel(this.channel);
  }
}
</script>
</body>
</html>
