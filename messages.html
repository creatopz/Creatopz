<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Creatopz™</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz logo">Creatopz<sup>™</sup></a>
    <a href="dashboard-creator.html" id="backLink" class="btn btn-outline btn-sm">← Back<span class="hide-xs"> to dashboard</span></a>
  </nav>
</header>

<section class="wrap" style="max-width:820px;padding-top:36px;padding-bottom:60px;display:flex;flex-direction:column;">
  <h1 style="margin-bottom:6px;">Messages</h1>
  <p class="body-sm" style="margin-bottom:26px;">Direct line to the Creatopz team — separate from campaign applications.</p>

  <div id="loadingState" class="skeleton" style="height:420px;"></div>

  <div id="chatPanel" class="panel" style="display:none;flex:1;flex-direction:column;min-height:420px;">
    <div id="messageList" style="flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:52vh;"></div>
    <form id="msgForm" style="border-top:1px solid var(--border);display:flex;gap:10px;padding:16px;">
      <input class="input" id="msgDraft" placeholder="Write a message…" style="flex:1;">
      <button type="submit" class="btn btn-accent" id="sendBtn">Send</button>
    </form>
  </div>

  <div class="error-text" id="pageError" style="min-height:20px;margin-top:14px;"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
let SESSION = null, CONVERSATION_ID = null;

function renderMessages(list) {
  const host = document.getElementById("messageList");
  if (!list.length) {
    host.innerHTML = `<div class="body-sm">No messages yet — say hello and the Creatopz team will reply here.</div>`;
    return;
  }
  host.innerHTML = list.map((m) => {
    const mine = m.sender_id === SESSION.user.id;
    return `<div style="align-self:${mine ? "flex-end" : "flex-start"};max-width:78%;">
      <div class="caption" style="text-align:${mine ? "right" : "left"};margin-bottom:4px;">${mine ? "You" : "Creatopz team"} · ${new Date(m.sent_at).toLocaleString()}</div>
      <div style="background:${mine ? "var(--ink)" : "var(--surface-2)"};color:${mine ? "#fff" : "var(--ink)"};border-radius:var(--r-md);padding:12px 16px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere;">${escapeHtml(m.body)}</div>
    </div>`;
  }).join("");
  host.scrollTop = host.scrollHeight;
}

async function loadMessages() {
  const { data } = await supabaseClient.from("messages").select("*").eq("conversation_id", CONVERSATION_ID).order("sent_at", { ascending: true });
  renderMessages(data || []);
}

document.getElementById("msgForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("msgDraft");
  const body = input.value.trim();
  if (!body) return;
  const btn = document.getElementById("sendBtn");
  setButtonLoading(btn, true, "Sending…");
  const { error } = await supabaseClient.from("messages").insert({ conversation_id: CONVERSATION_ID, sender_id: SESSION.user.id, body });
  setButtonLoading(btn, false);
  if (error) { document.getElementById("pageError").textContent = error.message; return; }
  input.value = "";
  await loadMessages();
});

async function boot() {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  SESSION = sessionData?.session;
  if (!SESSION) { location.href = "auth.html"; return; }
  const { data: profile } = await supabaseClient.from("profiles").select("role").eq("id", SESSION.user.id).single();
  if (profile?.role === "admin") { location.href = "admin-console.html"; return; }
  document.getElementById("backLink").href = profile?.role === "brand" ? "dashboard-brand.html" : "dashboard-creator.html";

  let { data: convo } = await supabaseClient.from("conversations").select("*").eq("participant_id", SESSION.user.id).maybeSingle();
  if (!convo) {
    const { data: created, error } = await supabaseClient.from("conversations").insert({ participant_id: SESSION.user.id }).select().single();
    if (error) { document.getElementById("pageError").textContent = "Couldn't start a conversation: " + error.message; return; }
    convo = created;
  }
  CONVERSATION_ID = convo.id;

  document.getElementById("loadingState").style.display = "none";
  document.getElementById("chatPanel").style.display = "flex";
  await loadMessages();

  supabaseClient.channel("messages-" + convo.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "conversation_id=eq." + convo.id }, () => loadMessages())
    .subscribe();
}

document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
