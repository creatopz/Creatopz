<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">

<style>
  .gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; }
  .gallery-tile{ position:relative; aspect-ratio:1/1; overflow:hidden; border-radius:var(--r-lg); background:var(--surface-2); }
  .gallery-tile img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s cubic-bezier(.16,1,.3,1); }
  .gallery-tile:hover img{ transform:scale(1.06); }
  .gallery-overlay{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(0,0,0,.75) 0%, transparent 60%); display:flex; align-items:flex-end; padding:16px; opacity:0; transition:opacity .3s ease; }
  .gallery-tile:hover .gallery-overlay{ opacity:1; }
  .gallery-overlay p{ color:#fff; font-size:13px; line-height:1.4; margin:0; }
  .gallery-ig-badge{ position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>

  <nav class="site-nav">

      <a href="directory.html">Creators</a>
      <a href="campaigns.html">Campaigns</a>

      <a href="auth.html?mode=signup" class="btn btn-primary btn-sm">Join</a>
    </div>
    <button class="nav-burger" data-nav-open aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </nav>
</header>

<div class="nav-drawer">
  <div class="nav-drawer-top">
    <span class="brand" style="color:#fff;"><img src="assets/logo.png" alt="" style="filter:invert(1) brightness(2);">Creatopz<sup>™</sup></span>
    <button class="nav-drawer-close" data-nav-close aria-label="Close menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg></button>
  </div>
  <div class="nav-drawer-links">
    <a href="index.html">Home</a>
    <a href="directory.html">Creators</a>
    <a href="campaigns.html">Campaigns</a>
    <a href="spotlight.html">Spotlight</a>
  </div>

    <a href="auth.html" class="btn btn-outline on-dark btn-block btn-lg">Log in</a>
    <a href="auth.html?mode=signup" class="btn btn-white btn-block btn-lg">Join Creatopz</a>
  </div>
</div>

<section class="section" style="padding-bottom:0;">
  <div class="wrap">
    <h1>Gallery</h1>
    <p class="body-sm" style="margin-top:8px;">A look at the graphics and posts we're putting out — follow along on <a href="https://instagram.com/creatopz" target="_blank" rel="noopener" style="color:var(--accent-700);font-weight:600;">@creatopz</a> for more.</p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="gallery-grid" id="galleryGrid">
      <div class="skeleton" style="aspect-ratio:1/1;"></div><div class="skeleton" style="aspect-ratio:1/1;"></div><div class="skeleton" style="aspect-ratio:1/1;"></div><div class="skeleton" style="aspect-ratio:1/1;"></div>
    </div>
  </div>
</section>

<footer class="site-footer" style="padding:36px 0;">
  <div class="wrap" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
    <span>© 2026 Creatopz™. All rights reserved.</span><span>Jodhpur, Rajasthan</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/motion.js"></script>
<script src="js/nav.js"></script>
<script>
const IG_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>`;

async function loadGallery() {
  const grid = document.getElementById("galleryGrid");
  const { data, error } = await supabaseClient
    .from("gallery_posts")
    .select("*")
    .eq("is_published", true)
    .order("display_order", { ascending: true })
    .order("created_at", { ascending: false });

  if (error) {
    grid.innerHTML = `<div class="state-block" style="grid-column:1/-1;"><div class="state-icon">!</div><h3>Something went wrong</h3><p>Couldn't load the gallery. Please try again.</p></div>`;
    return;
  }
  if (!data.length) {
    grid.innerHTML = `<div class="state-block" style="grid-column:1/-1;"><div class="state-icon">◎</div><h3>No posts yet</h3><p>Check back soon.</p></div>`;
    return;
  }

  grid.innerHTML = data.map((post) => {
    const tag = post.instagram_url ? "a" : "div";
    const href = post.instagram_url ? `href="${escapeHtml(post.instagram_url)}" target="_blank" rel="noopener"` : "";
    return `
      <${tag} class="gallery-tile" ${href}>
        <img src="${escapeHtml(post.image_url)}" alt="${escapeHtml(post.caption || "Creatopz post")}" loading="lazy">
        ${post.instagram_url ? `<div class="gallery-ig-badge">${IG_ICON}</div>` : ""}
        ${post.caption ? `<div class="gallery-overlay"><p>${escapeHtml(post.caption)}</p></div>` : ""}
      </${tag}>
    `;
  }).join("");
}

document.addEventListener("DOMContentLoaded", () => {
  renderAuthNav("#authNav");
  loadGallery();
});
</script>
</body>
</html>
