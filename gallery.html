<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Creatopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .gallery-head{padding:44px 0 8px;}
  .gallery-head h1{font-size:32px;margin-bottom:6px;}
  .gallery-head p{color:var(--grey);font-size:14.5px;}
  .gallery-head a.insta-link{color:var(--red);font-weight:600;}

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:4px;
    margin:28px 0 90px;
  }
  .gallery-tile{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:16px;
    background:var(--grey-light);
    cursor:pointer;
    opacity:0;
    transform:translateY(16px);
    transition:opacity .5s cubic-bezier(0.16,1,0.3,1), transform .5s cubic-bezier(0.16,1,0.3,1);
  }
  .gallery-tile.is-visible{opacity:1;transform:translateY(0);}
  .gallery-tile img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(1);
    transition:transform .5s cubic-bezier(0.16,1,0.3,1), filter .3s ease;
  }
  .gallery-tile:hover img{filter:grayscale(0);}
  .gallery-tile:hover img{transform:scale(1.06);}
  .gallery-overlay{
    position:absolute;inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.15) 55%, transparent 100%);
    display:flex;align-items:flex-end;padding:16px;
    opacity:0;transition:opacity .3s ease;
  }
  .gallery-tile:hover .gallery-overlay{opacity:1;}
  .gallery-overlay p{color:#fff;font-size:13px;line-height:1.4;margin:0;}
  .gallery-ig-badge{
    position:absolute;top:10px;right:10px;
    width:30px;height:30px;border-radius:50%;
    background:rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .3s ease;
  }
  .gallery-tile:hover .gallery-ig-badge{opacity:1;}
  .gallery-empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--grey);}

  @media (prefers-reduced-motion: reduce){
    .gallery-tile{transition:none !important;opacity:1;transform:none;}
  }
</style>
<link rel="stylesheet" href="css/soften.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz mark"> Creatopz<sup>™</sup></a>
    <div class="nav-cta" id="authNav"></div>
  </nav>
</header>

<div class="wrap gallery-head">
  <h1>Gallery</h1>
  <p>A look at the graphics and posts we're putting out — follow along on <a class="insta-link" href="https://instagram.com/creatopz" target="_blank" rel="noopener">@creatopz</a> for more.</p>
</div>

<div class="wrap">
  <div class="gallery-grid" id="galleryGrid">
    <p style="color:var(--grey);grid-column:1/-1;">Loading gallery...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/motion.js"></script>
<script>
  const IG_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>`;

  async function loadGallery() {
    const grid = document.getElementById("galleryGrid");
    const { data, error } = await supabaseClient
      .from("gallery_posts")
      .select("*")
      .eq("is_published", true)
      .order("display_order", { ascending: true })
      .order("created_at", { ascending: false });

    if (error) {
      grid.innerHTML = `<p style="color:#B8493D;grid-column:1/-1;">Couldn't load the gallery. Please try again.</p>`;
      console.error(error);
      return;
    }

    if (!data.length) {
      grid.innerHTML = `<div class="gallery-empty">No posts yet — check back soon.</div>`;
      return;
    }

    grid.innerHTML = data.map((post) => {
      const tag = post.instagram_url
        ? `<a class="gallery-tile" data-reveal href="${post.instagram_url}" target="_blank" rel="noopener">`
        : `<div class="gallery-tile" data-reveal>`;
      const closeTag = post.instagram_url ? `</a>` : `</div>`;
      return `
        ${tag}
          <img src="${post.image_url}" alt="${escapeHtml(post.caption || "Creatopz post")}" loading="lazy">
          ${post.instagram_url ? `<div class="gallery-ig-badge">${IG_ICON}</div>` : ""}
          ${post.caption ? `<div class="gallery-overlay"><p>${escapeHtml(post.caption)}</p></div>` : ""}
        ${closeTag}
      `;
    }).join("");

    if (typeof staggerInGrid === "function") staggerInGrid("#galleryGrid", ".gallery-tile");
  }

  renderAuthNav();
  loadGallery();
</script>
</body>
</html>
