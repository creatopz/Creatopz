<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All Books — Écrivoire Studios</title>
<meta name="description" content="Browse the full Écrivoire Studios catalogue — fiction, poetry, essays, design, philosophy, art, memoir and children's books.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23ffffff' stroke='%23141311' stroke-width='2.5'/%3E%3Ctext x='32' y='30' font-family='Georgia,serif' font-size='15' text-anchor='middle' fill='%23141311'%3E%C3%89crivoire%3C/text%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='15' text-anchor='middle' fill='%23141311'%3EStudios%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">

<header class="site-header" id="site-header"></header>

<main>
  <section class="section-pad-sm" style="padding-bottom:0;">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Home</a> <span>/</span> <span>Shop</span></div>
      <h1 class="h-xl" style="margin-top:1rem;">The full shelf</h1>
      <p class="lede" style="margin-top:.8rem;">Hand-picked, restocked constantly, priced honestly in ₹. Filter by category or search by title and author.</p>
    </div>
  </section>

  <section class="section-pad">
    <div class="wrap">
      <div class="toolbar" style="margin-top:1rem;">
        <div class="chip-row" id="genre-chips"></div>
        <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
          <button type="button" id="clear-badge" class="chip" hidden>Clear filter ✕</button>
          <input type="search" id="shop-search" style="margin:0;border:2.5px solid var(--ink);background:var(--paper-2);box-shadow:3px 3px 0 0 var(--ink);padding:.7rem .9rem;min-width:180px;" placeholder="Search title or author…" aria-label="Search books">
          <select id="shop-sort" style="margin:0;border:2.5px solid var(--ink);background:var(--paper-2);box-shadow:3px 3px 0 0 var(--ink);padding:.7rem .9rem;" aria-label="Sort books">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="title">Title: A–Z</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:1.4rem;">
        <span class="eyebrow" id="shop-result-count">17 books</span>
      </div>
      <div class="book-grid" id="shop-grid"></div>
    </div>
  </section>

  <section class="pull-quote" style="padding-block:4rem;">
    <div class="wrap">
      <span data-doodle="sparkle" class="doodle-red" style="width:34px;height:34px;display:inline-block;margin-bottom:.6rem;" aria-hidden="true"></span>
      <blockquote style="font-size:clamp(1.2rem,2.6vw,1.7rem);max-width:32ch;">Not sure where to start? Every shelf card is written by hand — ask us, we love this part.</blockquote>
      <a href="contact.html" class="btn btn-outline" style="margin-top:1.6rem;">Ask a bookseller</a>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<div id="cart-root"></div>

<script src="js/data.js"></script>
<script src="js/doodles.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/requests.js"></script>
<script src="js/mascot.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
</body>
</html>
