<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Creatopz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Creatopz mark"> Creatopz<sup>™</sup></a>
    <div class="nav-cta">
      <a href="login.html" class="btn btn-outline-dark" style="padding:10px 20px;font-size:14px;">Log in</a>
    </div>
  </nav>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Join Creatopz as a creator or a brand.</p>

    <div class="role-toggle" id="roleToggle">
      <div class="role-option selected" data-role="creator">
        <span class="role-emoji">🎬</span>Creator
      </div>
      <div class="role-option" data-role="brand">
        <span class="role-emoji">🏷️</span>Brand
      </div>
    </div>

    <form id="signupForm">
      <div class="field">
        <label for="fullName" id="fullNameLabel">Full name</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" minlength="6" required>
          <button type="button" class="password-toggle" data-target="password"></button>
        </div>
        <p class="hint">At least 6 characters.</p>
      </div>
      <p class="form-error" id="formError"></p>
      <div class="submit-row">
        <button type="submit" class="btn btn-red" id="submitBtn" style="width:100%;">Create account</button>
      </div>
    </form>
    <p style="margin-top:20px;font-size:14px;color:var(--grey);">
      Already have an account? <a href="login.html" style="color:var(--red);font-weight:600;">Log in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
  let selectedRole = "creator";
  qsa(".role-option").forEach((el) => {
    el.addEventListener("click", () => {
      qsa(".role-option").forEach((o) => o.classList.remove("selected"));
      el.classList.add("selected");
      selectedRole = el.dataset.role;
      document.getElementById("fullNameLabel").textContent =
        selectedRole === "brand" ? "Company name" : "Full name";
    });
  });

  document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const errorEl = document.getElementById("formError");
    errorEl.style.display = "none";
    setButtonLoading(btn, true, "Creating account...");
    try {
      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      await signUp(email, password, selectedRole, fullName);
      showToast("Account created! Check your email to confirm, then log in.", "success");
      setTimeout(() => (window.location.href = "login.html"), 1200);
    } catch (err) {
      errorEl.textContent = friendlyAuthError(err);
      errorEl.style.display = "block";
    } finally {
      setButtonLoading(btn, false);
    }
  });
</script>
</body>
</html>
